x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/keys/mycreds.json
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    - ./terraform/keys/mycreds.json:/opt/airflow/keys/mycreds.json:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── Metadata DB (Airflow) ──────────────────────────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ── Message Broker (KRaft — no Zookeeper) ─────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    ports:
      - "9092:9092"    # internal (used by Spark/producer inside Docker)
      - "29092:29092"  # external (used when running producer on host/Mac)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg==
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: always

  # One-shot container: creates Kafka topics after broker is healthy
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic it-job-offers-backfill \
          --replication-factor 1 --partitions 3

        kafka-topics --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic it-job-offers-cdc \
          --replication-factor 1 --partitions 3

        echo "Topics created:"
        kafka-topics --bootstrap-server kafka:9092 --list
    restart: "no"

  # ── CDC State Store ────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ── Stream Processing ──────────────────────────────────────────────────────
  spark:
    image: apache/spark:3.5.0
    user: root
    command: ["tail", "-f", "/dev/null"]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /opt/spark/work-dir/keys/mycreds.json
    ports:
      - "4040:4040"  # Spark Application UI (active while a job runs)
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./terraform/keys/mycreds.json:/opt/spark/work-dir/keys/mycreds.json:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: always

  # ── Producer ──────────────────────────────────────────────────────────────

  # One-shot backfill: run with `docker compose --profile backfill up producer`
  # Will not start during normal `docker compose up -d`
  producer:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./requirements.txt:/app/requirements.txt
      - ./.env:/app/.env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command: >
      bash -c "pip install -r requirements.txt -q &&
               PYTHONPATH=src python -m producer.backfill"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - backfill

  # One-shot CDC sync: run with `docker compose --profile cdc up producer-cdc`
  # Fetches current API state, diffs against Redis, publishes INSERT/UPDATE/EXPIRE events
  producer-cdc:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./requirements.txt:/app/requirements.txt
      - ./.env:/app/.env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command: >
      bash -c "pip install -r requirements.txt -q &&
               PYTHONPATH=src python -m producer.cdc"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - cdc

  # ── Orchestration ──────────────────────────────────────────────────────────

  # One-shot: initialises Airflow DB and creates admin user
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
        echo "Airflow initialised"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  kafka-data:
  redis-data:

networks:
  default:
    name: pipeline-net
